
name: Build Foundry VTT Module

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: foundry-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Generate manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          tag = os.environ["TAG"]

          if not re.fullmatch(r"[vV]\d+\.\d+\.\d+", tag):
              raise ValueError(f"Invalid tag: {tag}")

          version = tag[1:]

          with open("module.json", encoding="utf-8") as f:
              data = json.load(f)

          data["version"] = version
          data["manifest"] = (
              "https://raw.githubusercontent.com/"
              "TenteiGengetsu/anachronism-cn/"
              "main/module.json"
          )
          data["download"] = (
              "https://github.com/"
              "TenteiGengetsu/anachronism-cn/"
              f"releases/download/{tag}/"
              "anachronism-cn.zip"
          )

          with open("module.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Prepared version {version}")
          PY

      - name: Validate module files
        run: |
          python3 -m json.tool module.json > /dev/null
          test -f scripts/register.mjs
          test -d translations
          echo "Validation passed"

      - name: Package module
        run: |
          zip -r anachronism-cn.zip \
            module.json \
            coverage.json \
            scripts \
            translations \
            README.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            anachronism-cn.zip \
            module.json \
            --clobber

      - name: Update main manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add module.json

          if git diff --cached --quiet; then
            echo "Manifest already up to date"
          else
            git commit -m "chore: update Foundry manifest"
            git push origin HEAD:main
          fi
