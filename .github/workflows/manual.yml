
name: Build Foundry VTT Module

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("module.json", encoding="utf-8") as f:
              data = json.load(f)

          tag = os.environ["TAG"]
          assert tag == "v" + data["version"], "Version mismatch"
          assert data["id"] == "sf2e-anachronism-zh-cn"
          assert data["manifest"]
          assert data["download"]
          assert f"/{tag}/" in data["download"]
          print("Validation passed")
          PY

      - name: Package module
        run: |
          zip -r anachronism-cn.zip \
            module.json \
            coverage.json \
            scripts \
            translations \
            README.md

      - name: Upload release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            anachronism-cn.zip \
            --clobber
